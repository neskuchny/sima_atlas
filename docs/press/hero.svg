<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sima Atlas — hero image v3 (concept: "shared brain")

  Design intent (per operator feedback after v1 was rejected for being
  too technical and v2 was just ASCII):
    * NO file names, NO MCP/CLI/JSON jargon, NO numbers
    * Communicate the SYSTEM MEANING in 2 seconds: operator and AI
      both face a shared map; the map remembers, verifies, catches
      drift.
    * Visual hierarchy: top tagline → big central visual → loop →
      bottom tagline. Reads top-to-bottom in ~5 seconds.
    * Color palette mirrors the actual product UI: cream paper,
      dark ink, status-coded markers (green/yellow/red/grey).
    * Typography: Newsreader serif (italic) for taglines, JetBrains
      Mono for technical labels, system sans for body — fall back
      to web-safe equivalents if the named families aren't loaded.

  Aspect ratio 16:9 (1600x900). Drop into README via:
    <img src="docs/hero-mockup.svg" width="100%" alt="...">
  or convert to PNG with: rsvg-convert / inkscape / online tool.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid meet"
     font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-thin" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background — cream paper to match product UI -->
  <rect width="1600" height="900" fill="#F5EFE0"/>

  <!-- ================ TOP TAGLINE ================ -->
  <text x="800" y="80"
        font-family="'Newsreader', 'Georgia', serif"
        font-size="32" font-style="italic"
        text-anchor="middle"
        fill="#1a1a1a">
    AI без карты разваливается на 50 фичах.
  </text>

  <!-- ================ MAIN COMPOSITION ================ -->
  <!-- Left figure — OPERATOR -->
  <g transform="translate(180, 380)">
    <!-- head -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <!-- shoulders/body -->
    <path d="M -50,90 Q -50,40 0,40 Q 50,40 50,90"
          fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <text x="0" y="155"
          font-size="18" font-weight="600"
          text-anchor="middle" fill="#1a1a1a">ОПЕРАТОР</text>
    <text x="0" y="180"
          font-size="13"
          text-anchor="middle" fill="#666">пишет что хочет</text>
  </g>

  <!-- Right figure — AI -->
  <g transform="translate(1420, 380)">
    <!-- "head" — geometric to read as machine -->
    <rect x="-30" y="-30" width="60" height="60"
          fill="none" stroke="#1a1a1a" stroke-width="3" rx="6"/>
    <!-- "eye" -->
    <circle cx="-12" cy="-5" r="3" fill="#1a1a1a"/>
    <circle cx="12" cy="-5" r="3" fill="#1a1a1a"/>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#1a1a1a" stroke-width="2"/>
    <!-- shoulders -->
    <path d="M -50,90 Q -50,40 0,40 Q 50,40 50,90"
          fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <text x="0" y="155"
          font-size="18" font-weight="600"
          text-anchor="middle" fill="#1a1a1a">AI-АГЕНТ</text>
    <text x="0" y="180"
          font-size="13"
          text-anchor="middle" fill="#666">строит</text>
  </g>

  <!-- Center — THE CANVAS / MAP — visual hero -->
  <g transform="translate(550, 240)">
    <!-- canvas frame -->
    <rect x="0" y="0" width="500" height="320"
          fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2.5" rx="10"/>

    <!-- canvas label -->
    <text x="250" y="32"
          font-size="11" font-weight="600"
          letter-spacing="2.5"
          text-anchor="middle" fill="#888">ЖИВАЯ КАРТА ПРОДУКТА</text>

    <!-- feature blocks (abstract, with status colors) -->
    <!-- row 1 -->
    <g>
      <rect x="40" y="65" width="80" height="38" fill="#9DC79D" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="160" y="65" width="80" height="38" fill="#F0CB7A" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="280" y="65" width="80" height="38" fill="#9DC79D" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="400" y="65" width="80" height="38" fill="#E8E0CD" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="100" y="145" width="80" height="38" fill="#F0CB7A" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="220" y="145" width="80" height="38" fill="#9DC79D" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="340" y="145" width="80" height="38" fill="#D08B7A" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
    </g>
    <!-- row 3 -->
    <g>
      <rect x="160" y="225" width="80" height="38" fill="#9DC79D" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
      <rect x="280" y="225" width="80" height="38" fill="#F0CB7A" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
    </g>

    <!-- arrows between blocks (showing graph connections) -->
    <g stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow-thin)">
      <line x1="80" y1="103" x2="140" y2="145"/>
      <line x1="200" y1="103" x2="260" y2="145"/>
      <line x1="320" y1="103" x2="380" y2="145"/>
      <line x1="200" y1="183" x2="200" y2="225"/>
      <line x1="260" y1="183" x2="320" y2="225"/>
    </g>

    <!-- legend dots — 4 statuses with subtle labels -->
    <g transform="translate(40, 290)" font-size="10" fill="#666">
      <circle cx="0" cy="0" r="5" fill="#9DC79D" stroke="#1a1a1a" stroke-width="1"/>
      <text x="14" y="3">готово</text>
      <circle cx="80" cy="0" r="5" fill="#F0CB7A" stroke="#1a1a1a" stroke-width="1"/>
      <text x="94" y="3">в работе</text>
      <circle cx="180" cy="0" r="5" fill="#D08B7A" stroke="#1a1a1a" stroke-width="1"/>
      <text x="194" y="3">сломано</text>
      <circle cx="290" cy="0" r="5" fill="#E8E0CD" stroke="#1a1a1a" stroke-width="1"/>
      <text x="304" y="3">пусто</text>
    </g>
  </g>

  <!-- Arrows from figures to canvas — emphasising "both look at the same map" -->
  <line x1="240" y1="380" x2="540" y2="370"
        stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1370" y1="380" x2="1060" y2="370"
        stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Small connecting captions on the arrows -->
  <text x="370" y="350" font-size="12" font-style="italic" fill="#666">смотрит сюда</text>
  <text x="1175" y="350" font-size="12" font-style="italic" fill="#666" text-anchor="end">смотрит сюда</text>

  <!-- ================ THE LOOP ================ -->
  <!-- "Каждый виток оставляет след" — the closed cycle -->
  <g transform="translate(800, 700)">

    <!-- 4 stations -->
    <g>
      <!-- station 1: operator writes contract -->
      <circle cx="-330" cy="0" r="38" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
      <text x="-330" y="-5" font-size="13" text-anchor="middle" font-weight="600">оператор</text>
      <text x="-330" y="14" font-size="13" text-anchor="middle" font-weight="600">пишет</text>

      <!-- station 2: AI builds -->
      <circle cx="-110" cy="0" r="38" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
      <text x="-110" y="-5" font-size="13" text-anchor="middle" font-weight="600">AI</text>
      <text x="-110" y="14" font-size="13" text-anchor="middle" font-weight="600">строит</text>

      <!-- station 3: map verifies -->
      <circle cx="110" cy="0" r="38" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
      <text x="110" y="-5" font-size="13" text-anchor="middle" font-weight="600">карта</text>
      <text x="110" y="14" font-size="13" text-anchor="middle" font-weight="600">проверяет</text>

      <!-- station 4: map remembers -->
      <circle cx="330" cy="0" r="38" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
      <text x="330" y="-5" font-size="13" text-anchor="middle" font-weight="600">карта</text>
      <text x="330" y="14" font-size="13" text-anchor="middle" font-weight="600">помнит</text>
    </g>

    <!-- forward arrows between stations -->
    <g stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="-292" y1="0" x2="-148" y2="0"/>
      <line x1="-72" y1="0" x2="72" y2="0"/>
      <line x1="148" y1="0" x2="292" y2="0"/>
    </g>

    <!-- return loop arrow underneath -->
    <path d="M 330,38 Q 330,100 0,100 Q -330,100 -330,38"
          stroke="#1a1a1a" stroke-width="2" fill="none"
          stroke-dasharray="6,4"
          marker-end="url(#arrow)"/>
    <text x="0" y="125"
          font-size="13" font-style="italic"
          text-anchor="middle" fill="#666">
      → следующий виток физически читает что было раньше
    </text>
  </g>

  <!-- ================ BOTTOM TAGLINE ================ -->
  <text x="800" y="855"
        font-family="'Newsreader', 'Georgia', serif"
        font-size="42" font-weight="500"
        text-anchor="middle" fill="#1a1a1a">
    Общий мозг между тобой и AI
  </text>

</svg>
