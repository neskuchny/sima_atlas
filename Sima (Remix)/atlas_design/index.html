<!-- Live-data integration:
     data_static.js bakes an offline sample so the tool still opens
       without a backend.
     data_loader.js fetches /atlas/design-payload[?client=<id>] from the
       Atlas API server (defaults to http://localhost:8787) and OVERRIDES
       window.SIMA_DATA before App mounts. It also polls /atlas/state
       every 5s; on hash change it refetches and dispatches a
       `sima-data-changed` CustomEvent so the React tree can react. Set
       window.SIMA_API_BASE before this script loads to point at a
       remote backend in production. -->
<script src="data_static.js?v=r7-36"></script>
<script src="data_loader.js?v=r7-36"></script>
<script type="text/babel" src="tweaks-panel.jsx?v=r7-36"></script>
<script type="text/babel" src="graph.jsx?v=r7-36"></script>
<script type="text/babel" src="panels.jsx?v=r7-36"></script>
<script type="text/babel" src="views.jsx?v=r7-36"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "blueprint",
  "primaryView": "split",
  "showLayers": true,
  "liveActivity": true,
  "showLabels": false
}/*EDITMODE-END*/;

function App() {
  const data = window.SIMA_DATA;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [selectedId, setSelectedId] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [filters, setFilters] = useState(new Set());
  const [scanState, setScanState] = useState('idle'); // idle | scanning | found | resolved
  const [desyncResolved, setDesyncResolved] = useState(false);
  const [activeFlash, setActiveFlash] = useState(null);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [dockCollapsed, setDockCollapsed] = useState(false);
  const [activeAgent, setActiveAgent] = useState('all');
  const [toast, setToast] = useState(null);

  // Editable graph state
  const [modules, setModules] = useState(() => data.modules.map(m => ({ ...m })));
  const [edges, setEdges] = useState(() => data.edges.map(e => ({ ...e })));
  const [notes, setNotes] = useState([
    { id: 'n1', x: 1380, y: 90,  w: 200, color: 'yellow', text: 'metrics-DSL: согласовать словарь полей с ingest-schema до пятницы.' },
    { id: 'n2', x: 60,   y: 540, w: 190, color: 'pink',   text: 'P1 на неделю: refund flow + tile editor превью' },
  ]);
  const [schemaTitle, setSchemaTitle] = useState('Lensa · схема продукта');
  const [drillId, setDrillId] = useState(null);
  const [drillStack, setDrillStack] = useState([]); // path of parent ids when descending into subsystems
  const [showEdgeLabels, setShowEdgeLabels] = useState(true);
  // R-7.29 — canvas-tools панель плотно перекрывала канвас и его overlay'и.
  // По дефолту свёрнута, оператор сам разворачивает по chevron.
  const [canvasToolsOpen, setCanvasToolsOpen] = useState(false);
  const [onboarding, setOnboarding] = useState(true);
  const [onbStep, setOnbStep] = useState(0);
  const skipOnboarding = () => {
    setOnboarding(false);
    try { localStorage.setItem('sima_onb_seen', '1'); } catch {}
  };
  // First-time visitor: show; returning: skip. Persisted in localStorage.
  useEffect(() => {
    try { if (localStorage.getItem('sima_onb_seen') === '1') setOnboarding(false); } catch {}
  }, []);
  const [railOpen, setRailOpen] = useState(true);
  const [detailOpen, setDetailOpen] = useState(true);
  const [laneOverrides, setLaneOverrides] = useState({}); // { laneId: { y, height } }
  const [galleryOpen, setGalleryOpen] = useState(false);
  const [libraryOpen, setLibraryOpen] = useState(false);
  const [tzOpenFor, setTzOpenFor] = useState(null); // moduleId or null
  const [composerOpen, setComposerOpen] = useState(false);
  const [sysDocsOpen, setSysDocsOpen] = useState(false);
  const [proposalsOpen, setProposalsOpen] = useState(false);
  const [templatesOpen, setTemplatesOpen] = useState(false);
  const [subagentsOpen, setSubagentsOpen] = useState(false);
  const [syncReportOpen, setSyncReportOpen] = useState(false);
  const [productReviewOpen, setProductReviewOpen] = useState(false);
  const [archReviewOpen, setArchReviewOpen] = useState(false);
  const [proposalsCount, setProposalsCount] = useState(0);
  const [hooksOk, setHooksOk] = useState(null); // null=unknown true=ok false=drift
  // J3 — project picker. Reads available namespaces from /atlas/clients/list,
  // displays them as a dropdown in the topbar. Switching changes the URL's
  // ?client= and reloads the page so data_loader picks up the new namespace.
  const [clients, setClients] = useState(['main']);
  const [pickerOpen, setPickerOpen] = useState(false);
  const currentClient = (typeof window.__SIMA_DATA_CLIENT === 'string' && window.__SIMA_DATA_CLIENT) || 'main';
  const clientMissing = !!window.__SIMA_DATA_CLIENT_MISSING || (data?._meta?.missing === true);
  // Phase R-7.17 — payload-script crashed: surface error to operator instead
  // of pretending everything's normal with empty canvas.
  const payloadError = data?._meta?.error || null;

  const createMissingClient = async () => {
    if (!currentClient || currentClient === 'main') return;
    const r = await window.SIMA_API?.meta?.clientCreate(currentClient);
    if (r?.ok) window.location.reload();
    else window.alert(`Не удалось создать: ${r?.error || 'unknown'}`);
  };

  // Poll proposals count + cursor hooks status every 30s; cheap and gives
  // the topbar a live "чем-то внимание привлекают" indicator.
  useEffect(() => {
    let alive = true;
    const tick = async () => {
      if (!window.SIMA_API?.meta) return;
      try {
        const [pr, hs, cl] = await Promise.all([
          window.SIMA_API.meta.proposalsList(),
          window.SIMA_API.meta.cursorHooksStatus(),
          window.SIMA_API.meta.clientsList(),
        ]);
        if (!alive) return;
        if (pr?.ok) setProposalsCount(pr.items.filter((i) => !i.resolved && !i.accepted_at && !i.rejected_at).length);
        if (hs?.ok) setHooksOk(hs.status?.valid !== false);
        if (cl?.ok) setClients(cl.clients || ['main']);
      } catch {}
    };
    tick();
    const itv = setInterval(tick, 30_000);
    return () => { alive = false; clearInterval(itv); };
  }, []);

  useEffect(() => {
    if (!pickerOpen) return;
    const close = () => setPickerOpen(false);
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, [pickerOpen]);

  const switchClient = (newClient) => {
    const params = new URLSearchParams(window.location.search);
    if (newClient === 'main' || !newClient) params.delete('client');
    else params.set('client', newClient);
    const qs = params.toString();
    window.location.search = qs ? '?' + qs : '';
  };

  // L2 — undo/redo for top-level graph mutations (block / edge / note).
  // Each mutation pushes a {label, undo} record; Ctrl+Z pops + invokes,
  // Ctrl+Shift+Z (or Ctrl+Y) replays from redoStack. Subsystem and
  // contract-file edits stay outside this stack — they have their own
  // debounced flows. Stack is in-memory only (cleared on reload).
  const undoStack = useRef([]);
  const redoStack = useRef([]);
  const [undoTick, setUndoTick] = useState(0);
  const recordHistory = (label, undoFn) => {
    undoStack.current.push({ label, undo: undoFn });
    if (undoStack.current.length > 100) undoStack.current.shift();
    redoStack.current = []; // any new action invalidates redo
    setUndoTick((t) => t + 1);
  };
  const performUndo = () => {
    const last = undoStack.current.pop();
    if (!last) return;
    try {
      const redo = last.undo();
      if (typeof redo === 'function') redoStack.current.push({ label: last.label, undo: redo });
    } catch (e) {
      pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `undo failed: ${e.message}` });
    }
    setUndoTick((t) => t + 1);
  };
  const performRedo = () => {
    const last = redoStack.current.pop();
    if (!last) return;
    try {
      const undoAgain = last.undo();
      if (typeof undoAgain === 'function') undoStack.current.push({ label: last.label, undo: undoAgain });
    } catch (e) {
      pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `redo failed: ${e.message}` });
    }
    setUndoTick((t) => t + 1);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      const k = e.key.toLowerCase();
      // Skip when typing in an input / textarea / contenteditable
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); performUndo(); }
      if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); performRedo(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Subsystem-local module/edge state, keyed by subsystem id
  const [subState, setSubState] = useState({});
  const subSaveTimers = useRef({});
  const [subSaveStatus, setSubSaveStatus] = useState({}); // { [parent_id]: 'saving'|'saved'|'error' }

  // Debounced persist: when the operator edits a drilled-in subsystem,
  // wait 700ms after the last edit then POST /atlas/subsystems/save with
  // the full local state. Only b.* parents (real atlas blocks) are saved.
  const persistSubsystem = (parent_id) => {
    if (!parent_id?.startsWith('b.')) return;
    if (!window.SIMA_API?.subsystems) return;
    if (subSaveTimers.current[parent_id]) clearTimeout(subSaveTimers.current[parent_id]);
    subSaveTimers.current[parent_id] = setTimeout(async () => {
      delete subSaveTimers.current[parent_id];
      const cur = subState[parent_id];
      if (!cur) return;
      const meta = data.subsystems?.[parent_id] || {};
      setSubSaveStatus(s => ({ ...s, [parent_id]: 'saving' }));
      const r = await window.SIMA_API.subsystems.save(parent_id, {
        codename: meta.codename || parent_id.replace(/^b\./, ''),
        title: meta.title || (data.modules.find(m => m.id === parent_id)?.title || parent_id),
        subtitle: meta.subtitle || '',
        kpi: meta.kpi || [],
        modules: cur.modules || [],
        edges: cur.edges || [],
        lanes: meta.lanes || [],
        notes: cur.notes || [],
      });
      setSubSaveStatus(s => ({ ...s, [parent_id]: r?.ok ? 'saved' : 'error' }));
      setTimeout(() => setSubSaveStatus(s => { const c = { ...s }; delete c[parent_id]; return c; }), 1800);
      if (!r?.ok) pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `subsystem save ${parent_id} failed: ${r?.error}` });
    }, 700);
  };

  // PR — debounced persistence helper. Drag emits dozens of patch calls
  // per second; we don't want to POST on every frame. Buffer per-block
  // and flush 500ms after the last update.
  const persistTimers = useRef({});
  // L1 — track latest known updated_at per block so we can send it as
  // if_match_updated_at on every patch. Seeded from payload, refreshed
  // on every successful patch response.
  const blockEtags = useRef({});
  useEffect(() => {
    for (const m of (data.modules || [])) {
      if (m.id?.startsWith('b.') && m._raw_updated_at) blockEtags.current[m.id] = m._raw_updated_at;
    }
  }, [data]);
  const [conflictBlock, setConflictBlock] = useState(null); // { id, current, pending }

  const persistBlock = (id, patchAccum) => {
    if (!window.SIMA_API || !window.SIMA_API.patchBlock) return;
    if (id.startsWith('m-') || !id.startsWith('b.')) return; // local-only ids
    if (persistTimers.current[id]) clearTimeout(persistTimers.current[id]);
    persistTimers.current[id] = setTimeout(async () => {
      delete persistTimers.current[id];
      const etag = blockEtags.current[id];
      const r = await window.SIMA_API.patchBlock(id, etag ? { ...patchAccum, if_match_updated_at: etag } : patchAccum);
      if (r?.ok) {
        if (r.updated_at) blockEtags.current[id] = r.updated_at;
        return;
      }
      if (r?.error === 'etag_mismatch') {
        // Surface conflict modal: the operator can «Reload from server»
        // (drop our pending change + re-fetch) or «Overwrite» (re-patch
        // without if_match, will succeed unconditionally).
        setConflictBlock({ id, current: r.current, pending: patchAccum });
        return;
      }
      pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `patch ${id} failed: ${r?.error}` });
    }, 500);
  };

  const resolveConflictReload = async () => {
    if (!conflictBlock) return;
    if (conflictBlock.current?.updated_at) blockEtags.current[conflictBlock.id] = conflictBlock.current.updated_at;
    await (window.SIMA_API?.refresh && window.SIMA_API.refresh());
    setConflictBlock(null);
  };
  const resolveConflictOverwrite = async () => {
    if (!conflictBlock) return;
    const r = await window.SIMA_API.patchBlock(conflictBlock.id, conflictBlock.pending); // no if_match → unconditional
    if (r?.ok && r.updated_at) blockEtags.current[conflictBlock.id] = r.updated_at;
    if (!r?.ok) pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `force-patch ${conflictBlock.id} failed: ${r?.error}` });
    setConflictBlock(null);
  };

  const updateModule = (id, patch) => {
    setModules(M => M.map(m => {
      if (m.id !== id) return m;
      if (patch._short !== undefined) {
        if (!data.moduleDocs[id]) data.moduleDocs[id] = {};
        data.moduleDocs[id].short = patch._short;
        const { _short, ...rest } = patch;
        return { ...m, ...rest };
      }
      return { ...m, ...patch };
    }));
    // Persist structural fields. _short stays UI-only; the block's
    // mission.md is the canonical home for descriptions.
    const persistable = {};
    if ('x' in patch) persistable.x = patch.x;
    if ('y' in patch) persistable.y = patch.y;
    if ('title' in patch) persistable.title = patch.title;
    if ('size' in patch) persistable.size = patch.size;
    if ('status' in patch) persistable.status = patch.status;
    if (Object.keys(persistable).length) persistBlock(id, persistable);
  };

  const updateEdge = (i, patch) => setEdges(E => E.map((e, idx) => idx === i ? { ...e, ...patch } : e));
  const addEdge = async (e, opts = {}) => {
    setEdges(E => [...E, e]);
    if (window.SIMA_API && e.from?.startsWith('b.') && e.to?.startsWith('b.')) {
      const r = await window.SIMA_API.addEdge({ from: e.from, to: e.to, capability: e.label });
      if (!r?.ok) pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `addEdge failed: ${r?.error}` });
    }
    if (!opts._noHistory) {
      recordHistory(`+ связь ${e.from}→${e.to}`, () => {
        const idx = edges.findIndex(x => x.from === e.from && x.to === e.to);
        deleteEdge(idx >= 0 ? idx : edges.length, { _noHistory: true });
        return () => addEdge(e, { _noHistory: true });
      });
    }
  };
  const deleteEdge = async (i, opts = {}) => {
    const target = edges[i];
    if (!target) return;
    setEdges(E => E.filter((_, idx) => idx !== i));
    if (window.SIMA_API && target?.from?.startsWith('b.') && target?.to?.startsWith('b.')) {
      const r = await window.SIMA_API.deleteEdge({ from: target.from, to: target.to });
      if (!r?.ok) pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `deleteEdge failed: ${r?.error}` });
    }
    if (!opts._noHistory) {
      recordHistory(`- связь ${target.from}→${target.to}`, () => {
        addEdge(target, { _noHistory: true });
        return () => {
          const idx = edges.findIndex(x => x.from === target.from && x.to === target.to);
          if (idx >= 0) deleteEdge(idx, { _noHistory: true });
        };
      });
    }
  };

  const addNote = async (n, opts = {}) => {
    const local = { id: `n${Date.now()}`, ...n };
    setNotes(N => [...N, local]);
    let serverId = local.id;
    if (window.SIMA_API) {
      const r = await window.SIMA_API.addNote(n);
      if (r?.ok && r.note) {
        serverId = r.note.id;
        setNotes(N => N.map(x => x.id === local.id ? r.note : x));
      }
    }
    if (!opts._noHistory) {
      recordHistory('+ заметка', () => {
        deleteNote(serverId, { _noHistory: true });
        return () => addNote(n, { _noHistory: true });
      });
    }
  };
  const updateNote = (id, patch) => {
    setNotes(N => N.map(n => n.id === id ? { ...n, ...patch } : n));
    if (window.SIMA_API && id && !id.startsWith('n') && persistTimers.current) {
      // Debounced
      const k = '__note_' + id;
      if (persistTimers.current[k]) clearTimeout(persistTimers.current[k]);
      persistTimers.current[k] = setTimeout(() => {
        delete persistTimers.current[k];
        window.SIMA_API.patchNote(id, patch);
      }, 500);
    }
  };
  const deleteNote = (id, opts = {}) => {
    const target = notes.find(n => n.id === id);
    setNotes(N => N.filter(n => n.id !== id));
    if (window.SIMA_API && id && !id.startsWith('n')) {
      window.SIMA_API.deleteNote(id);
    }
    if (!opts._noHistory && target) {
      recordHistory('- заметка', () => {
        addNote(target, { _noHistory: true });
        return () => deleteNote(target.id, { _noHistory: true });
      });
    }
  };

  // Sima placeholder generator (just appends a draft so the UX makes sense)
  const onSimaGenerate = (kind, ref) => {
    if (kind === 'edge') {
      const e = edges[ref];
      if (!e) return;
      const a = modules.find(m => m.id === e.from);
      const b = modules.find(m => m.id === e.to);
      const label = `${a?.title.toLowerCase()} → ${b?.title.toLowerCase()}`;
      const biz = `Sima предлагает: эта связь нужна, чтобы ${b?.title} получал ${e.kind === 'data' ? 'данные' : e.kind === 'rbac' ? 'права доступа' : e.kind === 'schema' ? 'схему полей' : 'контракт'} от ${a?.title}.`;
      updateEdge(ref, { label, biz });
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: `✨ описал связь @${a?.tag} → @${b?.tag}` });
    } else if (kind === 'module') {
      const m = modules.find(x => x.id === ref);
      if (!m) return;
      const cur = data.moduleDocs[ref] || {};
      data.moduleDocs[ref] = { ...cur, short: cur.short || `Sima: ${m.title} — отвечает за слой ${m.layer}, контракт описан выше.` };
      setModules(M => [...M]); // force rerender
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: `✨ дополнил описание блока @${m.tag}` });
    }
  };

  // Activity log (terminal)
  const [log, setLog] = useState([
    { ts: '11:02', kind: 'head', msg: '— SIMA core загрузил контекст продукта lensa-core' },
    { ts: '11:02', agent: 'SIMA Core', kind: 'note', msg: 'Прочитано 16 модулей · 21 связь · 5 уроков из памяти' },
    { ts: '11:40', agent: 'Claude Code', kind: 'ok', msg: 'auth: RBAC роли viewer/editor/admin развернуты' },
    { ts: '12:08', agent: 'Claude Code', kind: 'ok', msg: 'ingest: backpressure включён, 50k events/sec → p95 47ms' },
    { ts: '12:22', agent: 'Cursor', kind: 'ok', msg: 'dashboard: tile editor превью добавлено, тесты зелёные' },
    { ts: '12:31', agent: 'Codex', kind: 'err', msg: 'billing/refund_flow: e2e упал — возврат больше суммы заказа' },
    { ts: '12:42', agent: 'SIMA Core', kind: 'warn', msg: 'metrics ↔ ingest: рассинхрон field user_id → actor_id (см. T-202)' },
  ]);

  // L3 — pushLog also persists to atlas/activity_log.jsonl so reloading
  // the page keeps history. Fire-and-forget; UI doesn't wait. We skip
  // the synthetic editorial demo lines (kind=head with mass-marker '—').
  const pushLog = (entry) => {
    const enriched = { ts: nowTs(), ...entry };
    setLog(L => [...L, enriched]);
    if (window.SIMA_API?.meta?.activityLogAppend && entry?.msg) {
      window.SIMA_API.meta.activityLogAppend({
        ts: new Date().toISOString(),
        agent: entry.agent || 'unknown',
        kind: entry.kind || 'note',
        msg: entry.msg,
      });
    }
  };

  // Phase R-7.11 — bridge для child-компонентов (panels.jsx, etc.)
  // которые не имеют прямого доступа к pushLog. Они dispatch'ят
  // CustomEvent 'sima-log-push' с {detail: entry}, App слушает и
  // прокидывает в pushLog. Без этого save-успех/save-fail в Контракт-
  // табе были невидимы оператору (только в modal'е, который сразу
  // закрывался).
  useEffect(() => {
    const onPush = (ev) => { if (ev?.detail) pushLog(ev.detail); };
    window.addEventListener('sima-log-push', onPush);
    return () => window.removeEventListener('sima-log-push', onPush);
  }, []);

  // Load last 100 persisted entries on mount so reloading doesn't lose
  // recent activity. We replace the editorial demo lines with the real
  // history when the backend has any.
  useEffect(() => {
    if (!window.SIMA_API?.meta?.activityLogTail) return;
    (async () => {
      const r = await window.SIMA_API.meta.activityLogTail(100);
      if (r?.ok && r.entries.length) {
        const formatted = r.entries.map((e) => ({
          ts: (e.ts || '').slice(11, 16) || nowTs(),
          agent: e.agent, kind: e.kind, msg: e.msg,
        }));
        setLog(formatted);
      }
    })();
  }, []);

  // ⌘K command bar
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdOpen(o => !o); }
      if (e.key === 'Escape') { setCmdOpen(false); setSelectedId(null); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Live activity loop — synthetic placeholder strings that demo «как
  // будет выглядеть, когда живые агенты работают». NOT real events: this
  // is a 5-line round-robin every 5.5s. Off by default in real client
  // sessions to avoid confusing the operator into thinking Cursor/Codex
  // are actually doing something. Flip on via tweaks-panel for the demo.
  useEffect(() => {
    if (!tweaks.liveActivity) return;
    const lines = [
      { agent: 'Cursor',      kind: 'note', msg: '[demo] datasets: уточнил RLS политику', flash: 'datasets' },
      { agent: 'Claude Code', kind: 'ok',   msg: '[demo] charts/funnel: добавлен conversion-tooltip', flash: 'charts' },
      { agent: 'SIMA Core',   kind: 'info', msg: '[demo] обновил wiki: dashboard.tile-editor', flash: 'dashboard' },
      { agent: 'Codex',       kind: 'note', msg: '[demo] tests: прогон unit · 312/312 ok', flash: 'tests' },
      { agent: 'Cursor',      kind: 'ok',   msg: '[demo] observ: добавил трейс на /v1/query', flash: 'observ' },
    ];
    let i = 0;
    const t = setInterval(() => {
      // Phase R-7.9 — re-check URL on EVERY tick (dynamic), not just at
      // effect mount. Earlier R-7.8 captured search at render and used it
      // as a useEffect dep — but window.location.search isn't reactive,
      // so SPA-style navigation between root and ?client=X didn't trigger
      // re-subscribe. Now demo skips the tick entirely if URL has client.
      const isClientSession = !!new URLSearchParams(window.location.search).get('client');
      if (isClientSession) return;
      const e = lines[i % lines.length];
      pushLog({ agent: e.agent, kind: e.kind, msg: e.msg });
      setActiveFlash(e.flash);
      setToast({ agent: e.agent, msg: e.msg, kind: e.kind });
      setTimeout(() => setActiveFlash(null), 700);
      setTimeout(() => setToast(null), 3200);
      i++;
    }, 5500);
    return () => clearInterval(t);
  }, [tweaks.liveActivity]);

  // Sync check flow — calls real /atlas/sync-check (b.core-sync runs the
  // sync_audit_context process). Falls back to the editorial mock when the
  // backend is unreachable so the demo still narrates.
  const runSyncCheck = async () => {
    setScanState('scanning');
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: '— запуск sync-check для блоков atlas/' });
    let live = false;
    try {
      const base = (window.SIMA_API_BASE || 'http://localhost:8787').replace(/\/$/, '');
      const r = await fetch(base + '/atlas/sync-check', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ block_id: 'b.core-sync' }),
      });
      const j = await r.json();
      live = true;
      // Surface last 12 non-empty lines of the process output as activity.
      const tail = String(j.out || j.stderr || '').split(/\n/).filter(Boolean).slice(-12);
      for (const ln of tail) {
        const kind = /\b(fail|err|drift|mismatch|❌|✗)\b/i.test(ln) ? 'warn' : 'note';
        pushLog({ agent: 'SIMA Core', kind, msg: ln });
      }
      if (j.ok) {
        setScanState(/drift|mismatch/i.test(tail.join(' ')) ? 'found' : 'resolved');
        if (/drift|mismatch/i.test(tail.join(' '))) pushLog({ agent: 'SIMA Core', kind: 'warn', msg: 'обнаружен рассинхрон — см. вывод выше' });
        else pushLog({ agent: 'SIMA Core', kind: 'ok', msg: '✓ sync-check прошёл, схема синхронна' });
      } else {
        setScanState('found');
        pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `sync-check завершился с ошибкой: ${j.error || 'unknown'}` });
      }
    } catch (e) {
      // Fallback editorial narration when API unreachable
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: '(API недоступен, показываю демо-сценарий)' });
    }
    if (!live) {
      setTimeout(() => pushLog({ agent: 'SIMA Core', kind: 'note', msg: 'auth ✓  ingest ✓  warehouse ✓  query ✓' }), 400);
      setTimeout(() => {
        pushLog({ agent: 'SIMA Core', kind: 'warn', msg: 'metrics ↔ ingest: AST использует поле user_id, в ingest-schema поле — actor_id' });
        setScanState('found');
      }, 1200);
    }
    setTimeout(() => { if (scanState !== 'found') setScanState('idle'); }, 4000);
  };

  const resolveDesync = () => {
    pushLog({ agent: 'SIMA Core', kind: 'note', msg: '— применяю исправление: AST поле actor_id, обновляю кеш SQL' });
    setTimeout(() => pushLog({ agent: 'Claude Code', kind: 'ok', msg: 'metrics: AST→SQL обновлён, тест T-202 переведён в progress' }), 700);
    setTimeout(() => {
      pushLog({ agent: 'SIMA Core', kind: 'ok', msg: '✓ рассинхрон устранён, схема синхронна' });
      setDesyncResolved(true);
      setScanState('resolved');
      setTimeout(() => setScanState('idle'), 2200);
    }, 1400);
  };

  const onSendToAgent = async (agentId, mod) => {
    const agent = data.agents.find(a => a.id === agentId)?.title || agentId;
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: `— пакую контекст блока @${mod.tag} → ${agent}` });
    pushLog({ agent: 'SIMA Core', kind: 'note', msg: `включено: описание · KPI · логика · ${(data.tasks[mod.id]||[]).length} задач · история (${data.lessons.filter(l=>l.module===mod.id).length} уроков)` });
    setActiveAgent('all');
    setDockCollapsed(false);
    setActiveFlash(mod.id);
    setTimeout(() => setActiveFlash(null), 800);

    // Real run via /runs/start (non-blocking). Only fires when the block id
    // is an Atlas-shaped id (b.*); modules from the static fallback (m-*)
    // can't be run because they have no atlas/blocks/<id>/ folder.
    if (!mod.id.startsWith('b.')) {
      pushLog({ agent, kind: 'note', msg: `(demo-режим: запуск работает только для b.* блоков из живого atlas)` });
      return;
    }
    try {
      const base = (window.SIMA_API_BASE || 'http://localhost:8787').replace(/\/$/, '');
      const r = await fetch(base + '/runs/start', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ block_id: mod.id, agent: agentId }),
      });
      const j = await r.json();
      if (j.ok) {
        pushLog({ agent, kind: 'ok', msg: `запуск создан (pid=${j.pid}). Вкладка «Запуски» покажет фазы FSM.` });
      } else {
        pushLog({ agent, kind: 'fail', msg: `не удалось стартовать: ${j.error}` });
      }
    } catch (e) {
      pushLog({ agent, kind: 'fail', msg: `сеть недоступна: ${e.message || e}` });
    }
  };

  // K2 — "Совет Клода" picks a per-screen system prompt via context_kind.
  // The first arg is the module (or null for graph-level kinds); the
  // second arg overrides defaults: { kind, prompt, context }.
  const onClaudeAdvice = async (mod, opts = {}) => {
    if (!window.SIMA_API?.claudeAdvice) {
      pushLog({ agent: 'Claude', kind: 'note', msg: 'Совет Клода: функция готовится (требуется b.llm-gateway).' });
      return;
    }
    const kind = opts.kind || 'block';
    const tag = mod?.tag ? `@${mod.tag}` : '(весь граф)';
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: `— спрашиваю Клода про ${tag} (${kind})…` });
    const defaultPrompts = {
      block:            `Дай практический совет по блоку «${mod?.title || ''}» (слой: ${mod?.layer || ''}). Что упростить, что усилить, какие риски?`,
      block_acceptance: `Блок «${mod?.title || ''}» не проходит приёмку. Почему он мог бы упасть? Дай 1-2 конкретных фикса.`,
      block_connections:`Блок «${mod?.title || ''}» — посмотри на его связи. Какой одной зависимости здесь не хватает?`,
      block_field:      `Помоги улучшить контент одного контрактного файла блока «${mod?.title || ''}».`,
      tz:               `ТЗ блока «${mod?.title || ''}». Что убрать чтобы стало плотнее? Что сделать тестируемым?`,
      graph_overview:   'Посмотри на весь граф продукта. Какое одно действие сейчас даст максимальный leverage?',
      gallery:          'Какой артефакт из галереи стоит превратить в блок прямо сейчас?',
    };
    const r = await window.SIMA_API.claudeAdvice({
      block_id: mod?.id,
      prompt: opts.prompt || defaultPrompts[kind] || defaultPrompts.block,
      context: opts.context || (mod ? { layer: mod.layer, status: mod.status } : { module_count: data.modules.length, edge_count: data.edges.length }),
      context_kind: kind,
    });
    if (r?.ok && r.advice) {
      pushLog({
        agent: r.mock ? 'Claude (demo)' : 'Claude',
        kind: r.mock ? 'note' : 'ok',
        msg: `✨ ${r.advice}`,
      });
    } else {
      pushLog({ agent: 'Claude', kind: 'fail', msg: `Совет недоступен: ${r?.error || 'unknown'}` });
    }
  };

  const onAddModule = async (presetArg) => {
    // Phase R-4 — defensive normalize. Toolbar `<button onClick={onAddModule}>`
    // hands us a SyntheticEvent (which has its own .x/.y!), and CommandBar
    // calls with no args. Ignore anything that doesn't look like our preset
    // shape so we don't accidentally place a block at screen-coords or hit
    // an undefined access deep in this fn and crash the React tree.
    const preset = (presetArg && typeof presetArg === 'object' && !presetArg.nativeEvent && !presetArg.target) ? presetArg : null;
    try {
    // Generate a unique id (`b.<base>-<n>` until free).
    // Atlas convention: block IDs start with `b.`. We prefix automatically
    // so design-UI-created blocks are indistinguishable from CLI-created.
    const existingIds = new Set(modules.map(m => m.id));
    const base = (preset?.title || 'block').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 32) || 'block';
    let n = 1; while (existingIds.has(`b.${base}-${n}`)) n++;
    const id = preset?.id || `b.${base}-${n}`;
    // Layer mapping: design layer → atlas layer (reverse of adapter)
    const REV_LAYER = { backend: 'logic', frontend: 'front', logic: 'logic', tests: 'testing' };
    // Default placement near current modules' centroid
    const avg = modules.length
      ? { x: modules.reduce((s, m) => s + m.x, 0) / modules.length,
          y: modules.reduce((s, m) => s + m.y, 0) / modules.length }
      : { x: 400, y: 300 };
    const created = {
      id,
      title: preset?.title || 'Новый модуль',
      tag: preset?.tag || id.replace(/^b\./, ''),
      layer: preset?.layer || 'logic',
      x: preset?.x ?? Math.round(avg.x + 40),
      y: preset?.y ?? Math.round(avg.y + 40),
      status: preset?.status || 'todo',
      priority: preset?.priority ?? 3,
      checked: false,
      size: preset?.size || 'md',
    };
    // Optimistic update: show on canvas immediately
    setModules(M => [...M, created]);
    setSelectedId(id);
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: `Создан модуль ${created.title} (${id}).` });
    // Persist to atlas/graph.json. On failure rollback the optimistic add.
    if (window.SIMA_API && window.SIMA_API.createBlock) {
      // Phase R-7.3 — auto-retry on "already exists". UI's local state
      // and server graph.json can drift (stale state from previous failed
      // sessions, manual file edits, etc.). Instead of dying with «Откат»,
      // pick the next free suffix and try again. Up to 5 attempts; if all
      // collide — give up with a useful message that points to /reset.
      let r;
      let attemptedId = id;
      // Phase R-7.11 — поднял retry с 5 до 100. Реальный кейс оператора:
      // в graph.json накопилось b.block-1 ... b.block-12 от прошлых
      // попыток до R-6/R-7 фиксов; 5 retry-ев не хватало.
      for (let attempt = 0; attempt < 100; attempt++) {
        try {
          r = await window.SIMA_API.createBlock({
            id: attemptedId,
            title: created.title,
            layer: REV_LAYER[created.layer] || 'logic',
            status: 'idea',
            x: created.x, y: created.y, size: created.size,
          });
        } catch (e) {
          r = { ok: false, error: String(e.message || e) };
        }
        if (r?.ok) break;
        if (!/already exists/i.test(String(r?.error || ''))) break;
        // Server says id is taken; drift between UI and server state.
        n++;
        attemptedId = `b.${base}-${n}`;
      }
      if (!r || !r.ok) {
        setModules(M => M.filter(x => x.id !== id));
        setSelectedId(null);
        const isCollision = /already exists/i.test(String(r?.error || ''));
        pushLog({
          agent: 'SIMA Core',
          kind: 'fail',
          msg: isCollision
            ? `Не удалось создать блок: graph.json клиента содержит много стале b.${base}-N. Снеси atlas/clients/${currentClient}/blocks/ + перепиши graph.json (или дождись /reset endpoint в R-7.4). Откат.`
            : `Не удалось сохранить ${id}: ${r?.error || 'unknown'}. Откат.`,
        });
      } else {
        // Reflect the actually-saved id back into local state if it drifted
        // from the optimistic one (R-7.3 retry might have bumped suffix).
        if (attemptedId !== id) {
          setModules(M => M.map(x => x.id === id ? { ...x, id: attemptedId, tag: attemptedId.replace(/^b\./, '') } : x));
          setSelectedId(attemptedId);
          pushLog({ agent: 'SIMA Core', kind: 'note', msg: `id ${id} был занят на сервере; создан как ${attemptedId}.` });
        }
        pushLog({ agent: 'SIMA Core', kind: 'ok', msg: `Сохранено в atlas/clients/${currentClient}/graph.json (+8 контрактных файлов)` });
        // Record undo: archive (soft-delete) the just-created block.
        recordHistory(`+ блок ${attemptedId}`, async () => {
          if (window.SIMA_API?.deleteBlock) await window.SIMA_API.deleteBlock(attemptedId, false);
          setModules(M => M.filter(x => x.id !== id));
          if (selectedId === id) setSelectedId(null);
          return async () => {
            if (window.SIMA_API?.patchBlock) await window.SIMA_API.patchBlock(id, { status: 'idea' });
            setModules(M => [...M, created]);
          };
        });
      }
    }
    } catch (e) {
      // Phase R-4 — never blank the canvas. Surface the error in the log
      // strip so the operator sees what failed and the React tree stays up.
      console.error('onAddModule failed:', e);
      pushLog({ agent: 'SIMA Core', kind: 'fail', msg: `Ошибка при создании модуля: ${String(e?.message || e)}` });
    }
  };

  const filtersList = [
    { id: 'done', label: 'готово' },
    { id: 'progress', label: 'в работе' },
    { id: 'todo', label: 'в очереди' },
    { id: 'desync', label: 'рассинхрон' },
    { id: 'fail', label: 'ошибка' },
    { id: 'blocked', label: 'заблок.' },
  ];
  const toggleFilter = (id) => {
    setFilters(F => {
      const n = new Set(F);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };

  const themeAttr = tweaks.theme === 'editorial' ? '' : tweaks.theme;
  useEffect(() => {
    if (themeAttr) document.documentElement.setAttribute('data-theme', themeAttr);
    else document.documentElement.removeAttribute('data-theme');
  }, [themeAttr]);

  const view = tweaks.primaryView;

  // Resolve current subsystem (drilled-into) — gives modules/edges/lanes for the active graph
  // R-7.34 — drill-down работает ДЛЯ ЛЮБОГО блока, даже если у него
  // ещё нет подсистемы. Раньше fallback'или в drillId (single-focus
  // mode), что не давало возможности создать модули внутри. Теперь
  // ensureSubState возвращает пустую подсистему — оператор кликает
  // «+ Новый модуль» внутри drill-view, persistSubsystem сохраняет
  // на disk при первом изменении.
  const drillTarget = drillStack.length ? drillStack[drillStack.length - 1] : null;
  const activeSub = drillTarget ? (data.subsystems[drillTarget] || null) : null;
  const ensureSubState = (id) => {
    if (subState[id]) return subState[id];
    const sub = data.subsystems[id];
    const fresh = sub
      ? { modules: sub.modules.map(m => ({ ...m })), edges: sub.edges.map(e => ({ ...e })), notes: [] }
      : { modules: [], edges: [], notes: [] };
    setSubState(s => ({ ...s, [id]: fresh }));
    return fresh;
  };
  const curSub = drillTarget ? (subState[drillTarget] || ensureSubState(drillTarget)) : null;

  const activeModules = curSub ? curSub.modules : modules;
  const activeEdges = curSub ? curSub.edges : edges;
  const activeNotes = curSub ? curSub.notes : notes;
  // Phase R-7.20 — defensive: data.lanes может отсутствовать в payload-е
  // (как было до этого commit'а), не должны валить React-tree на
  // activeLanes[0]. Empty array — нейтральный fallback.
  const activeLanes = (activeSub ? activeSub.lanes : data.lanes) || [];

  // Wrapped subState mutators — every change triggers a debounced save
  // of the corresponding subsystem to disk. Local state still updates
  // synchronously so the UI feels instant.
  const k = () => drillStack[drillStack.length - 1];
  const subsystemTouched = (parent_id) => persistSubsystem(parent_id);
  const updateActiveModule = curSub
    ? (id, patch) => { setSubState(s => ({ ...s, [k()]: { ...s[k()], modules: s[k()].modules.map(m => m.id === id ? { ...m, ...patch } : m) } })); subsystemTouched(k()); }
    : updateModule;
  const updateActiveEdge = curSub
    ? (i, patch) => { setSubState(s => ({ ...s, [k()]: { ...s[k()], edges: s[k()].edges.map((e, idx) => idx === i ? { ...e, ...patch } : e) } })); subsystemTouched(k()); }
    : updateEdge;
  const addActiveNote = curSub
    ? (n) => { setSubState(s => { const kk = k(); return { ...s, [kk]: { ...s[kk], notes: [...s[kk].notes, { id: `n${Date.now()}`, ...n }] } }; }); subsystemTouched(k()); }
    : addNote;
  const updateActiveNote = curSub
    ? (id, patch) => { setSubState(s => { const kk = k(); return { ...s, [kk]: { ...s[kk], notes: s[kk].notes.map(n => n.id === id ? { ...n, ...patch } : n) } }; }); subsystemTouched(k()); }
    : updateNote;
  const deleteActiveNote = curSub
    ? (id) => { setSubState(s => { const kk = k(); return { ...s, [kk]: { ...s[kk], notes: s[kk].notes.filter(n => n.id !== id) } }; }); subsystemTouched(k()); }
    : deleteNote;
  const deleteActiveEdge = curSub
    ? (i) => { setSubState(s => { const kk = k(); return { ...s, [kk]: { ...s[kk], edges: s[kk].edges.filter((_, idx) => idx !== i) } }; }); subsystemTouched(k()); }
    : deleteEdge;
  const addActiveEdge = curSub
    ? (e) => { setSubState(s => { const kk = k(); return { ...s, [kk]: { ...s[kk], edges: [...s[kk].edges, e] } }; }); subsystemTouched(k()); }
    : addEdge;

  // R-7.34 — добавление модулей в drill-view. В drill mode «+ Новый модуль»
  // должно класть блок в subState (подсистему текущего блока), а не в
  // outer graph.json. После disk-persist'а через subsystems.save модуль
  // появится у data.subsystems[parent_id] на следующем refresh.
  const addActiveBlock = curSub
    ? (preset) => {
        const parent = k();
        const existing = (subState[parent]?.modules || []).map(m => m.id);
        let n = 1; let id;
        do { id = `${parent}.s${n++}`; } while (existing.includes(id));
        const tag = id.replace(/^b\./, '');
        const newMod = {
          id, tag,
          title: 'Новый подмодуль',
          layer: 'logic', size: 'M', priority: 3, status: 'todo',
          x: preset?.x ?? 80, y: preset?.y ?? 80,
        };
        setSubState(s => ({ ...s, [parent]: { ...s[parent], modules: [...(s[parent]?.modules || []), newMod] } }));
        subsystemTouched(parent);
      }
    : onAddModule;

  const onDrillDown = (id) => {
    // R-7.34 — всегда проваливаемся, даже если subsystems[id] ещё пуст.
    // ensureSubState создаст пустую подсистему в local state, оператор
    // добавит первый модуль через «+ Новый модуль», и persistSubsystem
    // запишет на disk. Раньше был fallback в drillId (single-focus mode),
    // оператор оставался в том же layer и не мог создать подмодули.
    setDrillStack(s => [...s, id]);
    setSelectedId(null);
    const has = !!(data.subsystems && data.subsystems[id]);
    pushLog({
      agent: 'SIMA Core', kind: 'note',
      msg: has
        ? `↳ открыл подсистему @${data.modules.find(m=>m.id===id)?.tag} (${data.subsystems[id].modules.length} модулей)`
        : `↳ открыл пустую подсистему @${data.modules.find(m=>m.id===id)?.tag}. Жми «+ Новый модуль» внутри.`,
    });
  };
  const drillUp = () => {
    if (drillStack.length) {
      setDrillStack(s => s.slice(0, -1));
      setSelectedId(null);
    } else {
      setDrillId(null);
    }
  };

  // Lane resize
  const onLaneResize = (laneId, dy) => {
    setLaneOverrides(o => {
      const cur = o[laneId] || {};
      const lane = activeLanes.find(l => l.id === laneId);
      const baseH = cur.height ?? lane.height;
      return { ...o, [laneId]: { ...cur, height: Math.max(80, baseH + dy) } };
    });
  };
  const effectiveLanes = useMemo(() => {
    // Lanes stack vertically — resizing one shifts the next
    let cursorY = activeLanes[0]?.y ?? 60;
    return activeLanes.map((l, i) => {
      const o = laneOverrides[l.id] || {};
      const h = o.height ?? l.height;
      const y = i === 0 ? l.y : cursorY;
      cursorY = y + h + 30;
      return { ...l, y, height: h };
    });
  }, [activeLanes, laneOverrides]);

  // Editable product fields
  const updateProductField = (path, value) => {
    // path like 'goal' or 'mission'
    data.product[path] = value;
    setEdges(e => [...e]); // force rerender
  };

  return (
    <div className={`app ${(!selectedId || !detailOpen) ? 'no-detail' : ''}`} data-layers={tweaks.showLayers ? 'on' : 'off'} data-rail={railOpen ? 'open' : 'closed'} data-detail={detailOpen ? 'open' : 'closed'}>
      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand">
          <span className="brand-mark serif">sima</span>
        </div>
        <div className="project-picker" onClick={(e) => e.stopPropagation()}>

          onOpenComposer={() => { setCmdOpen(false); setComposerOpen(true); }}
          onOpenSysDocs={() => { setCmdOpen(false); setSysDocsOpen(true); }}
          onOpenTz={() => { setCmdOpen(false); if (selectedId) setTzOpenFor(selectedId); }}
          selectedId={selectedId}
        />
      )}

      {/* COMPOSER MODAL — multi-source intake → artifact + Sima synthesis */}
      {composerOpen && (
        <div className="composer-modal" onClick={() => setComposerOpen(false)}>
          <div className="composer-modal-inner" onClick={e => e.stopPropagation()}>
            <Composer
              onClose={() => setComposerOpen(false)}
              productContext={data.product}
              onPublished={(art) => {
                pushLog({ agent: 'SIMA Core', kind: 'ok', msg: `Артефакт «${art.title}» (${art.id}) опубликован.` });
              }}
              onBlocksCreated={(p) => {
                pushLog({ agent: 'SIMA Core', kind: 'head', msg: `Sima создала блок ${p.id} — «${p.title}»` });
                pushLog({ agent: 'SIMA Core', kind: 'note', msg: `мiссия + ${p.kpi.length} KPI + ${p.acceptance.length} критериев записаны на диск` });
                // Refresh underlying graph payload so the new block appears
                window.SIMA_API?.refresh && window.SIMA_API.refresh();
              }}
            />
          </div>
        </div>
      )}

      {/* GALLERY MODAL — browse / insert / delete artifacts */}
      {galleryOpen && (
        <Gallery
          onClose={() => setGalleryOpen(false)}
          onPick={(art) => {
            pushLog({ agent: 'SIMA Core', kind: 'note', msg: `Артефакт «${art.title}» подцеплен к проекту.` });
          }}
        />
      )}

      {/* LIBRARY MODAL — saved blocks browser */}
      {libraryOpen && (
        <Library
          data={data}
          currentModuleId={selectedId}
          onClose={() => setLibraryOpen(false)}
          onPick={(art) => {
            // Inserting a library block as a new module on canvas
            onAddModule({ title: art.title, layer: art.blockLayer || 'logic', tag: art.tags?.[0] });
            setLibraryOpen(false);
            pushLog({ agent: 'SIMA Core', kind: 'note', msg: `Блок «${art.title}» добавлен из библиотеки.` });
          }}
        />
      )}

      {/* SYSTEM DOCS MODAL — Roadmap / Wiki / End-user docs / project / rules / stack */}
      {sysDocsOpen && (
        <SystemDocs onClose={() => setSysDocsOpen(false)} />
      )}

      {/* PROPOSALS MODAL */}
      {proposalsOpen && (
        <ProposalsPanel
          onClose={() => setProposalsOpen(false)}
          onAfterAction={(kind, id) => {
            pushLog({ agent: 'SIMA Core', kind: kind === 'accept' ? 'ok' : 'note', msg: `${kind === 'accept' ? 'Принял' : 'Отклонил'} предложение ${id}` });
          }}
        />
      )}

      {/* SYNC REPORT MODAL — Phase O-1 */}
      {syncReportOpen && (
        <SyncReportPanel
          onClose={() => setSyncReportOpen(false)}
          onJumpToBlock={(bid) => {
            setSelectedId(bid);
            setSyncReportOpen(false);
            setTweak('primaryView', 'split');
            setDetailOpen(true);
          }}
        />
      )}

      {/* PRODUCT REVIEW MODAL — Phase P-2.2: same panel, auto-runs with LLM judge */}
      {productReviewOpen && (
        <SyncReportPanel
          autoVerifier={true}
          onClose={() => setProductReviewOpen(false)}
          onJumpToBlock={(bid) => {
            setSelectedId(bid);
            setProductReviewOpen(false);
            setTweak('primaryView', 'split');
            setDetailOpen(true);
          }}
        />
      )}

      {/* ARCHITECTURE REVIEW MODAL — Phase Q-3 */}
      {archReviewOpen && (
        <ArchReviewPanel
          onClose={() => setArchReviewOpen(false)}
          onJumpToBlock={(bid) => {
            setSelectedId(bid);
            setArchReviewOpen(false);
            setTweak('primaryView', 'split');
            setDetailOpen(true);
          }}
        />
      )}

      {/* SUBAGENTS MODAL — Phase N-3 */}
      {subagentsOpen && (
        <SubagentsPanel
          onClose={() => setSubagentsOpen(false)}
          currentBlockId={selectedId}
        />
      )}

      {/* TEMPLATES MODAL — apply schema preset (Phase F-5) */}
      {templatesOpen && (
        <TemplatesPanel
          onClose={() => setTemplatesOpen(false)}
          onApplied={(r) => {
            pushLog({ agent: 'SIMA Core', kind: 'ok', msg: `Применён шаблон ${r.template_id}: создано ${r.created.length} блоков` });
            window.SIMA_API?.refresh && window.SIMA_API.refresh();
          }}
        />
      )}

      {/* TZ EXPORTER MODAL — markdown TZ + send-to-agent + save-as-artifact */}
      {tzOpenFor && (
        <TZExporter
          data={data}
          moduleId={tzOpenFor}
          onClose={() => setTzOpenFor(null)}
          onSendToAgent={(agentId, mod) => { onSendToAgent(agentId, mod); setTzOpenFor(null); }}
          onClaudeAdvice={onClaudeAdvice}
        />
      )}

      {/* TWEAKS */}
      <TweaksPanel title="Tweaks">
        <TweakSection title="Стиль">
          <TweakRadio label="Тема"
            value={tweaks.theme}
            onChange={v => setTweak('theme', v)}
            options={[
              { value: 'editorial', label: 'Editorial' },
              { value: 'blueprint', label: 'Blueprint' },
              { value: 'dark', label: 'Dark' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Вид">
          <TweakRadio label="Главный канвас"
            value={tweaks.primaryView}
            onChange={v => setTweak('primaryView', v)}
            options={[
              { value: 'graph', label: 'Граф' },
              { value: 'split', label: 'Граф + детали' },
              { value: 'layered', label: 'Слои 3D' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Карта">
          <TweakToggle label="Подсветка слоёв (backend / frontend / logic / tests)"
            checked={tweaks.showLayers}
            onChange={v => setTweak('showLayers', v)} />
          <TweakToggle label="Подписи на связях"
            checked={showEdgeLabels}
            onChange={v => setShowEdgeLabels(v)} />
          <TweakToggle label="Анимировать живые события"
            checked={tweaks.liveActivity}
            onChange={v => setTweak('liveActivity', v)} />
        </TweakSection>
        <TweakSection title="Демо">
          <TweakButton label="Показать подсказки заново"
            onClick={() => { setOnbStep(0); setOnboarding(true); }} />
          <TweakButton label="Запустить sync-check + рассинхрон"
            onClick={() => { setDesyncResolved(false); runSyncCheck(); }} />
          <TweakButton label="Сбросить состояние"
            onClick={() => { setDesyncResolved(false); setScanState('idle'); setSelectedId(null); setFilters(new Set()); setDrillId(null); setEdges(data.edges.map(e => ({ ...e }))); setModules(data.modules.map(m => ({ ...m }))); }} />
        </TweakSection>
      </TweaksPanel>

      {/* L1 — ETag conflict modal */}
      {conflictBlock && (
        <div className="cmd-bar" onClick={() => {/* require explicit choice */}}>
          <div className="cmd-box conflict-box" onClick={e => e.stopPropagation()}>
            <div className="sysdocs-head">
              <div>
                <div className="mono" style={{ fontSize: 11, color: 'var(--st-fail)', letterSpacing: '0.08em' }}>КОНФЛИКТ ВЕРСИЙ</div>
                <h3 style={{ margin: '4px 0 0', fontFamily: 'Newsreader, serif', fontStyle: 'italic', fontSize: 19 }}>
                  Блок «{conflictBlock.id}» был изменён другим клиентом
                </h3>
              </div>
            </div>
            <div className="conflict-body">
              <div className="meta" style={{ fontSize: 12, marginBottom: 10 }}>
                Сервер пришёл с обновлением <span className="mono">{conflictBlock.current?.updated_at || 'неизвестно'}</span>,
                но вы уже начали свою правку. Что сделать?
              </div>
              <div className="conflict-pair">
                <div className="conflict-side">
                  <div className="meta" style={{ fontSize: 10.5, marginBottom: 4 }}>СЕРВЕР (свежий)</div>
                  <pre className="conflict-pre">{JSON.stringify(conflictBlock.current || {}, null, 2)}</pre>
                </div>
                <div className="conflict-side">
                  <div className="meta" style={{ fontSize: 10.5, marginBottom: 4 }}>ВАША ПРАВКА</div>
                  <pre className="conflict-pre">{JSON.stringify(conflictBlock.pending || {}, null, 2)}</pre>
                </div>
              </div>
            </div>
            <div className="sysdocs-foot" style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
              <button className="pill" onClick={resolveConflictReload}>↻ Загрузить серверную версию</button>
              <button className="pill primary" onClick={resolveConflictOverwrite} style={{ background: 'var(--st-fail)', borderColor: 'var(--st-fail)' }}>⚠ Перезаписать своим</button>
            </div>
          </div>
        </div>
      )}

      {/* ONBOARDING */}
      {onboarding && (() => {
        // K1 — interactive 5-step tour. Each step targets one UI surface
        // and (when applicable) places a "spotlight" hint near it.
        const steps = [
          {
            eyebrow: 'sima atlas · 30 секунд',
            title: 'Это карта вашего продукта.',
            body: <>Каждый блок — модуль. Цвет точки и полоска снизу = статус. Стрелки — кто кого использует. AI-агенты получают контекст <em>именно нужного</em> блока, не всю кодовую базу.</>,
            tip: null,
          },
          {
            eyebrow: 'шаг 2 / 5 · детали блока',
            title: 'Кликайте по блокам.',
            body: <>Один клик — справа открывается детальная панель: <strong>Обзор · Контракт · Задачи · Запуски · Приёмка · Подмодули · Память · Связи</strong>. Двойной клик — провалиться внутрь блока (если есть подсхема).</>,
            tip: 'Попробуйте кликнуть по любому блоку →',
          },
          {
            eyebrow: 'шаг 3 / 5 · агенты',
            title: 'Отправьте блок в Claude / Cursor / Codex.',
            body: <>В детальной панели «Запуски» — <strong>«Запустить блок →»</strong>. Sima соберёт контекст-пак, спавнит агента в фоновом workspace, показывает живой лог + acceptance verdict. Если упало — <strong>«↻ Исправить и перезапустить»</strong>.</>,
            tip: 'Симфония FSM: PreparingWorkspace → LaunchingAgent → Running → Verifying → Succeeded.',
          },
          {
            eyebrow: 'шаг 4 / 5 · артефакты',
            title: 'Любой источник → артефакт.',
            body: <>В шапке <strong>＋ Артефакт</strong>: вставьте транскрипт встречи / документ / ссылку → Sima извлечёт <em>цели · ограничения · идеи · риски · термины</em>, а потом предложит блоки на их основе. Принял → блок создан с готовыми mission/kpi/acceptance.</>,
            tip: '⊞ Галерея — все ваши артефакты, ⌘ Библиотека — переиспользуемые блоки.',
          },
          {
            eyebrow: 'шаг 5 / 5 · ⌘K + ✨ Sima',
            title: 'Пара клавиш — и всё под рукой.',
            body: <>⌘K (или Ctrl+K) — палитра команд: создать модуль, открыть галерею, ТЗ, шаблоны. Восклицательный знак <strong>!</strong> на блоке — контракт неполон. <strong>✨ Совет Клода</strong> в шапке — Sima посмотрит на весь граф и подскажет следующий шаг. Ctrl+Z — отмена.</>,
            tip: 'Готово, поехали.',
          },
        ];
        const step = steps[onbStep];
        const last = onbStep === steps.length - 1;
        return (
          <div className="onboarding" onClick={skipOnboarding}>
            <div className="onb-card" onClick={e => e.stopPropagation()}>
              <div className="onb-eyebrow mono">{step.eyebrow}</div>
              <h2>{step.title}</h2>
              <p>{step.body}</p>
              {step.tip && <div className="onb-tip">{step.tip}</div>}
              <div className="onb-progress">
                {steps.map((_, i) => (
                  <span
                    key={i}
                    className={`onb-dot ${i === onbStep ? 'active' : ''} ${i < onbStep ? 'past' : ''}`}
                    onClick={() => setOnbStep(i)}
                  />
                ))}
              </div>
              <div className="onb-actions">
                <button className="onb-skip" onClick={skipOnboarding}>пропустить</button>
                <div style={{ display: 'flex', gap: 6 }}>
                  {onbStep > 0 && (
                    <button className="pill" onClick={() => setOnbStep(s => s - 1)}>← назад</button>
                  )}
                  {!last && (
                    <button className="pill primary" onClick={() => setOnbStep(s => s + 1)}>далее →</button>
                  )}
                  {last && (
                    <button className="pill primary" onClick={skipOnboarding}>поехали →</button>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function CommandBar({ data, onClose, onSelect, onSync, onAddModule, onOpenGallery, onOpenLibrary, onOpenComposer, onOpenSysDocs, onOpenTz, selectedId }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const items = useMemo(() => {
    const cmds = [
      { type: 'cmd', ic: '⟳', label: 'Запустить sync-check', hint: '⏎', run: onSync },
      { type: 'cmd', ic: '＋', label: 'Создать новый модуль', hint: '⏎', run: () => { if (onAddModule) onAddModule(); onClose(); } },
      { type: 'cmd', ic: '⊞', label: 'Открыть галерею артефактов', hint: '⏎', run: () => onOpenGallery && onOpenGallery() },
      { type: 'cmd', ic: '⌘', label: 'Открыть библиотеку блоков', hint: '⏎', run: () => onOpenLibrary && onOpenLibrary() },
      { type: 'cmd', ic: '＋', label: 'Синтезировать артефакт из источника', hint: '⏎', run: () => onOpenComposer && onOpenComposer() },
      { type: 'cmd', ic: '📖', label: 'Системные доки (Roadmap / Wiki / End-user)', hint: '⏎', run: () => onOpenSysDocs && onOpenSysDocs() },
    ];
    if (selectedId) {
      cmds.push({ type: 'cmd', ic: '✎', label: `Сгенерировать ТЗ для @${data.modules.find(m=>m.id===selectedId)?.tag}`, hint: '⏎', run: () => onOpenTz && onOpenTz() });
    }
    cmds.push({ type: 'cmd', ic: '⤴', label: 'Открыть Roadmap', hint: '⏎', run: () => onClose() });
    const mods = data.modules.map(m => ({
      type: 'mod', ic: '◆', label: m.title, hint: '@' + m.tag, run: () => onSelect(m.id),
    }));
    const all = [...cmds, ...mods];
    if (!q) return all;
    const ql = q.toLowerCase();
    return all.filter(x => x.label.toLowerCase().includes(ql) || (x.hint || '').toLowerCase().includes(ql));
  }, [q]);

  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, items.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
    if (e.key === 'Enter')     { e.preventDefault(); items[active]?.run(); }
  };

  return (
    <div className="cmd-bar" onClick={onClose}>
      <div className="cmd-box" onClick={e => e.stopPropagation()}>
        <input
          ref={inputRef}
          placeholder="Команда или модуль…"
          value={q}
          onChange={e => { setQ(e.target.value); setActive(0); }}
          onKeyDown={onKey}
        />
        <div className="cmd-list">
          {items.slice(0, 12).map((it, i) => (
            <div key={i} className={`cmd-row ${i === active ? 'active' : ''}`} onMouseEnter={() => setActive(i)} onClick={() => it.run()}>
              <span className="ic">{it.ic}</span>
              <span>{it.label}</span>
              <span className="hint">{it.hint}</span>
            </div>
          ))}
          {items.length === 0 && <div style={{ padding: 14, color: 'var(--ink-3)', fontSize: 12 }}>Ничего не найдено</div>}
        </div>
      </div>
    </div>
  );
}

function nowTs() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// PR — wait for live data fetch (with a hard 600ms cap baked into
// data_loader.js) so App sees the freshest window.SIMA_DATA. If the
// fetch arrives later, we re-mount on the `sima-data-changed` event.
const __bootPromise = window.__SIMA_DATA_BOOT_PROMISE || Promise.resolve();
__bootPromise.then(() => {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  function mount() { root.render(<App key={(window.SIMA_DATA && window.SIMA_DATA._meta && window.SIMA_DATA._meta.generated_at) || Date.now()} />); }
  mount();
  // Live updates: re-mount on `sima-data-changed`. Cheap because the
  // App tree is small; the `key` change forces React to read the fresh
  // window.SIMA_DATA closure-free.
  window.addEventListener('sima-data-changed', mount);
});
</script>
</body>
</html>
