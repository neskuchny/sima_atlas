<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIMA Atlas — визуальное программирование с памятью</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Live-data integration:
     data_static.js bakes an offline sample so the tool still opens
       without a backend.
     data_loader.js fetches /atlas/design-payload[?client=<id>] from the
       Atlas API server (defaults to http://localhost:8787) and OVERRIDES
       window.SIMA_DATA before App mounts. It also polls /atlas/state
       every 5s; on hash change it refetches and dispatches a
       `sima-data-changed` CustomEvent so the React tree can react. Set
       window.SIMA_API_BASE before this script loads to point at a
       remote backend in production. -->
<script src="data_static.js"></script>
<script src="data_loader.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="graph.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "blueprint",
  "primaryView": "split",
  "showLayers": true,
  "liveActivity": true,
  "showLabels": false
}/*EDITMODE-END*/;

function App() {
  const data = window.SIMA_DATA;
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [selectedId, setSelectedId] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [filters, setFilters] = useState(new Set());
  const [scanState, setScanState] = useState('idle'); // idle | scanning | found | resolved
  const [desyncResolved, setDesyncResolved] = useState(false);
  const [activeFlash, setActiveFlash] = useState(null);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [dockCollapsed, setDockCollapsed] = useState(false);
  const [activeAgent, setActiveAgent] = useState('all');
  const [toast, setToast] = useState(null);

  // Editable graph state
  const [modules, setModules] = useState(() => data.modules.map(m => ({ ...m })));
  const [edges, setEdges] = useState(() => data.edges.map(e => ({ ...e })));
  const [notes, setNotes] = useState([
    { id: 'n1', x: 1380, y: 90,  w: 200, color: 'yellow', text: 'metrics-DSL: согласовать словарь полей с ingest-schema до пятницы.' },
    { id: 'n2', x: 60,   y: 540, w: 190, color: 'pink',   text: 'P1 на неделю: refund flow + tile editor превью' },
  ]);
  const [schemaTitle, setSchemaTitle] = useState('Lensa · схема продукта');
  const [drillId, setDrillId] = useState(null);
  const [drillStack, setDrillStack] = useState([]); // path of parent ids when descending into subsystems
  const [showEdgeLabels, setShowEdgeLabels] = useState(true);
  const [onboarding, setOnboarding] = useState(true);
  const [railOpen, setRailOpen] = useState(true);
  const [detailOpen, setDetailOpen] = useState(true);
  const [laneOverrides, setLaneOverrides] = useState({}); // { laneId: { y, height } }

  // Subsystem-local module/edge state, keyed by subsystem id
  const [subState, setSubState] = useState({});

  const updateModule = (id, patch) => {
    setModules(M => M.map(m => {
      if (m.id !== id) return m;
      // store free-form module short desc onto data.moduleDocs (live)
      if (patch._short !== undefined) {
        if (!data.moduleDocs[id]) data.moduleDocs[id] = {};
        data.moduleDocs[id].short = patch._short;
        const { _short, ...rest } = patch;
        return { ...m, ...rest };
      }
      return { ...m, ...patch };
    }));
  };

  const updateEdge = (i, patch) => setEdges(E => E.map((e, idx) => idx === i ? { ...e, ...patch } : e));
  const addEdge = (e) => setEdges(E => [...E, e]);
  const deleteEdge = (i) => setEdges(E => E.filter((_, idx) => idx !== i));

  const addNote = (n) => setNotes(N => [...N, { id: `n${Date.now()}`, ...n }]);
  const updateNote = (id, patch) => setNotes(N => N.map(n => n.id === id ? { ...n, ...patch } : n));
  const deleteNote = (id) => setNotes(N => N.filter(n => n.id !== id));

  // Sima placeholder generator (just appends a draft so the UX makes sense)
  const onSimaGenerate = (kind, ref) => {
    if (kind === 'edge') {
      const e = edges[ref];
      if (!e) return;
      const a = modules.find(m => m.id === e.from);
      const b = modules.find(m => m.id === e.to);
      const label = `${a?.title.toLowerCase()} → ${b?.title.toLowerCase()}`;
      const biz = `Sima предлагает: эта связь нужна, чтобы ${b?.title} получал ${e.kind === 'data' ? 'данные' : e.kind === 'rbac' ? 'права доступа' : e.kind === 'schema' ? 'схему полей' : 'контракт'} от ${a?.title}.`;
      updateEdge(ref, { label, biz });
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: `✨ описал связь @${a?.tag} → @${b?.tag}` });
    } else if (kind === 'module') {
      const m = modules.find(x => x.id === ref);
      if (!m) return;
      const cur = data.moduleDocs[ref] || {};
      data.moduleDocs[ref] = { ...cur, short: cur.short || `Sima: ${m.title} — отвечает за слой ${m.layer}, контракт описан выше.` };
      setModules(M => [...M]); // force rerender
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: `✨ дополнил описание блока @${m.tag}` });
    }
  };

  // Activity log (terminal)
  const [log, setLog] = useState([
    { ts: '11:02', kind: 'head', msg: '— SIMA core загрузил контекст продукта lensa-core' },
    { ts: '11:02', agent: 'SIMA Core', kind: 'note', msg: 'Прочитано 16 модулей · 21 связь · 5 уроков из памяти' },
    { ts: '11:40', agent: 'Claude Code', kind: 'ok', msg: 'auth: RBAC роли viewer/editor/admin развернуты' },
    { ts: '12:08', agent: 'Claude Code', kind: 'ok', msg: 'ingest: backpressure включён, 50k events/sec → p95 47ms' },
    { ts: '12:22', agent: 'Cursor', kind: 'ok', msg: 'dashboard: tile editor превью добавлено, тесты зелёные' },
    { ts: '12:31', agent: 'Codex', kind: 'err', msg: 'billing/refund_flow: e2e упал — возврат больше суммы заказа' },
    { ts: '12:42', agent: 'SIMA Core', kind: 'warn', msg: 'metrics ↔ ingest: рассинхрон field user_id → actor_id (см. T-202)' },
  ]);

  const pushLog = (entry) => setLog(L => [...L, { ts: nowTs(), ...entry }]);

  // ⌘K command bar
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setCmdOpen(o => !o); }
      if (e.key === 'Escape') { setCmdOpen(false); setSelectedId(null); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Live activity loop
  useEffect(() => {
    if (!tweaks.liveActivity) return;
    const lines = [
      { agent: 'Cursor',      kind: 'note', msg: 'datasets: уточнил RLS политику', flash: 'datasets' },
      { agent: 'Claude Code', kind: 'ok',   msg: 'charts/funnel: добавлен conversion-tooltip', flash: 'charts' },
      { agent: 'SIMA Core',   kind: 'info', msg: 'обновил wiki: dashboard.tile-editor', flash: 'dashboard' },
      { agent: 'Codex',       kind: 'note', msg: 'tests: прогон unit · 312/312 ok', flash: 'tests' },
      { agent: 'Cursor',      kind: 'ok',   msg: 'observ: добавил трейс на /v1/query', flash: 'observ' },
    ];
    let i = 0;
    const t = setInterval(() => {
      const e = lines[i % lines.length];
      pushLog({ agent: e.agent, kind: e.kind, msg: e.msg });
      setActiveFlash(e.flash);
      setToast({ agent: e.agent, msg: e.msg, kind: e.kind });
      setTimeout(() => setActiveFlash(null), 700);
      setTimeout(() => setToast(null), 3200);
      i++;
    }, 5500);
    return () => clearInterval(t);
  }, [tweaks.liveActivity]);

  // Sync check flow
  const runSyncCheck = () => {
    setScanState('scanning');
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: '— запуск проверки синхронизации (16 модулей, 21 связь)' });
    setTimeout(() => pushLog({ agent: 'SIMA Core', kind: 'note', msg: 'auth ✓  ingest ✓  warehouse ✓  query ✓  events ✓' }), 600);
    setTimeout(() => pushLog({ agent: 'SIMA Core', kind: 'note', msg: 'datasets ✓  charts ✓  dashboard ✓  filters ✓' }), 1200);
    setTimeout(() => {
      pushLog({ agent: 'SIMA Core', kind: 'warn', msg: 'metrics ↔ ingest: AST использует поле user_id, в ingest-schema поле — actor_id' });
      pushLog({ agent: 'SIMA Core', kind: 'warn', msg: 'предложение: переименовать metrics-dsl/AST.user_id → actor_id, ре-генерация SQL' });
      setScanState('found');
    }, 2000);
  };

  const resolveDesync = () => {
    pushLog({ agent: 'SIMA Core', kind: 'note', msg: '— применяю исправление: AST поле actor_id, обновляю кеш SQL' });
    setTimeout(() => pushLog({ agent: 'Claude Code', kind: 'ok', msg: 'metrics: AST→SQL обновлён, тест T-202 переведён в progress' }), 700);
    setTimeout(() => {
      pushLog({ agent: 'SIMA Core', kind: 'ok', msg: '✓ рассинхрон устранён, схема синхронна' });
      setDesyncResolved(true);
      setScanState('resolved');
      setTimeout(() => setScanState('idle'), 2200);
    }, 1400);
  };

  const onSendToAgent = (agentId, mod) => {
    const agent = data.agents.find(a => a.id === agentId).title;
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: `— пакую контекст блока @${mod.tag} → ${agent}` });
    setTimeout(() => pushLog({ agent: 'SIMA Core', kind: 'note', msg: `включено: описание · KPI · логика · ${(data.tasks[mod.id]||[]).length} задач · история (${data.lessons.filter(l=>l.module===mod.id).length} уроков)` }), 350);
    setTimeout(() => pushLog({ agent, kind: 'note', msg: `получил контекст @${mod.tag} (≈${Math.floor(800 + Math.random()*1200)} токенов вместо ~12k)` }), 800);
    setTimeout(() => pushLog({ agent, kind: 'ok', msg: `начал работу над ${mod.title}` }), 1300);
    setActiveAgent('all');
    setDockCollapsed(false);
    setActiveFlash(mod.id);
    setTimeout(() => setActiveFlash(null), 800);
  };

  const onAddModule = () => {
    pushLog({ agent: 'SIMA Core', kind: 'head', msg: '— добавление нового модуля (вы можете кликнуть правой по канвасу)' });
  };

  const filtersList = [
    { id: 'done', label: 'готово' },
    { id: 'progress', label: 'в работе' },
    { id: 'todo', label: 'в очереди' },
    { id: 'desync', label: 'рассинхрон' },
    { id: 'fail', label: 'ошибка' },
    { id: 'blocked', label: 'заблок.' },
  ];
  const toggleFilter = (id) => {
    setFilters(F => {
      const n = new Set(F);
      if (n.has(id)) n.delete(id); else n.add(id);
      return n;
    });
  };

  const themeAttr = tweaks.theme === 'editorial' ? '' : tweaks.theme;
  useEffect(() => {
    if (themeAttr) document.documentElement.setAttribute('data-theme', themeAttr);
    else document.documentElement.removeAttribute('data-theme');
  }, [themeAttr]);

  const view = tweaks.primaryView;

  // Resolve current subsystem (drilled-into) — gives modules/edges/lanes for the active graph
  const activeSub = drillStack.length ? data.subsystems[drillStack[drillStack.length - 1]] : null;
  const ensureSubState = (id) => {
    if (subState[id]) return subState[id];
    const sub = data.subsystems[id];
    if (!sub) return null;
    const fresh = { modules: sub.modules.map(m => ({ ...m })), edges: sub.edges.map(e => ({ ...e })), notes: [] };
    setSubState(s => ({ ...s, [id]: fresh }));
    return fresh;
  };
  const curSub = activeSub ? (subState[drillStack[drillStack.length - 1]] || ensureSubState(drillStack[drillStack.length - 1])) : null;

  const activeModules = curSub ? curSub.modules : modules;
  const activeEdges = curSub ? curSub.edges : edges;
  const activeNotes = curSub ? curSub.notes : notes;
  const activeLanes = activeSub ? activeSub.lanes : data.lanes;

  const updateActiveModule = curSub
    ? (id, patch) => setSubState(s => ({ ...s, [drillStack[drillStack.length - 1]]: { ...s[drillStack[drillStack.length - 1]], modules: s[drillStack[drillStack.length - 1]].modules.map(m => m.id === id ? { ...m, ...patch } : m) } }))
    : updateModule;
  const updateActiveEdge = curSub
    ? (i, patch) => setSubState(s => ({ ...s, [drillStack[drillStack.length - 1]]: { ...s[drillStack[drillStack.length - 1]], edges: s[drillStack[drillStack.length - 1]].edges.map((e, idx) => idx === i ? { ...e, ...patch } : e) } }))
    : updateEdge;
  const addActiveNote = curSub
    ? (n) => setSubState(s => { const k = drillStack[drillStack.length - 1]; return { ...s, [k]: { ...s[k], notes: [...s[k].notes, { id: `n${Date.now()}`, ...n }] } }; })
    : addNote;
  const updateActiveNote = curSub
    ? (id, patch) => setSubState(s => { const k = drillStack[drillStack.length - 1]; return { ...s, [k]: { ...s[k], notes: s[k].notes.map(n => n.id === id ? { ...n, ...patch } : n) } }; })
    : updateNote;
  const deleteActiveNote = curSub
    ? (id) => setSubState(s => { const k = drillStack[drillStack.length - 1]; return { ...s, [k]: { ...s[k], notes: s[k].notes.filter(n => n.id !== id) } }; })
    : deleteNote;
  const deleteActiveEdge = curSub
    ? (i) => setSubState(s => { const k = drillStack[drillStack.length - 1]; return { ...s, [k]: { ...s[k], edges: s[k].edges.filter((_, idx) => idx !== i) } }; })
    : deleteEdge;

  const onDrillDown = (id) => {
    if (data.subsystems && data.subsystems[id]) {
      setDrillStack(s => [...s, id]);
      setSelectedId(null);
      pushLog({ agent: 'SIMA Core', kind: 'note', msg: `↳ открыл подсистему @${data.modules.find(m=>m.id===id)?.tag} (${data.subsystems[id].modules.length} модулей)` });
    } else {
      // Fallback: single-module focus on current graph
      setDrillId(id);
    }
  };
  const drillUp = () => {
    if (drillStack.length) {
      setDrillStack(s => s.slice(0, -1));
      setSelectedId(null);
    } else {
      setDrillId(null);
    }
  };

  // Lane resize
  const onLaneResize = (laneId, dy) => {
    setLaneOverrides(o => {
      const cur = o[laneId] || {};
      const lane = activeLanes.find(l => l.id === laneId);
      const baseH = cur.height ?? lane.height;
      return { ...o, [laneId]: { ...cur, height: Math.max(80, baseH + dy) } };
    });
  };
  const effectiveLanes = useMemo(() => {
    // Lanes stack vertically — resizing one shifts the next
    let cursorY = activeLanes[0]?.y ?? 60;
    return activeLanes.map((l, i) => {
      const o = laneOverrides[l.id] || {};
      const h = o.height ?? l.height;
      const y = i === 0 ? l.y : cursorY;
      cursorY = y + h + 30;
      return { ...l, y, height: h };
    });
  }, [activeLanes, laneOverrides]);

  // Editable product fields
  const updateProductField = (path, value) => {
    // path like 'goal' or 'mission'
    data.product[path] = value;
    setEdges(e => [...e]); // force rerender
  };

  return (
    <div className={`app ${!selectedId ? 'no-detail' : ''}`} data-layers={tweaks.showLayers ? 'on' : 'off'} data-rail={railOpen ? 'open' : 'closed'} data-detail={detailOpen ? 'open' : 'closed'}>
      {/* TOPBAR */}
      <div className="topbar">
        <div className="brand">
          <span className="brand-mark serif">sima</span>
        </div>
        <div className="crumbs">
          <em>{data.product.title}</em> &nbsp;·&nbsp; {data.modules.filter(m => m.status === 'done').length}/{data.modules.length} готово &nbsp;·&nbsp; <span className="mono" style={{textTransform:'none'}}>main</span>
        </div>
        <div className="spacer" />

        <div className="view-tabs">
          <button className={view === 'graph' ? 'active' : ''} onClick={() => setTweak('primaryView', 'graph')}>Граф</button>
          <button className={view === 'layered' ? 'active' : ''} onClick={() => setTweak('primaryView', 'layered')}>Слои 3D</button>
          <button className={view === 'split' ? 'active' : ''} onClick={() => setTweak('primaryView', 'split')}>Граф + детали</button>
        </div>

        <button className="pill" onClick={runSyncCheck} disabled={scanState === 'scanning'}>
          <span className="dot" style={{ background: scanState === 'found' ? 'var(--st-desync)' : 'var(--st-done)' }} />
          {scanState === 'scanning' ? 'проверяю…' : scanState === 'found' ? '1 рассинхрон' : 'sync ok'}
        </button>
        <button className="pill" onClick={() => setCmdOpen(true)}>
          ⌘K · команда
        </button>
      </div>

      {/* LEFT RAIL */}
      {railOpen ? (
        <ContextRail data={data} onClose={() => setRailOpen(false)} onUpdateField={updateProductField} />
      ) : (
        <button className="rail-reopen" onClick={() => setRailOpen(true)} title="Открыть контекст">▶</button>
      )}

      {/* CANVAS STAGE — positioned wrapper so absolute overlays anchor to it */}
      <div className="canvas-stage">
      {view !== 'layered' ? (
        <>
          <GraphCanvas
            data={{ ...data, lanes: effectiveLanes, subsystem: activeSub }}
            modules={drillId && !curSub ? activeModules.filter(m => {
              if (m.id === drillId) return true;
              return activeEdges.some(e => (e.from === drillId && e.to === m.id) || (e.to === drillId && e.from === m.id));
            }) : activeModules}
            edges={activeEdges}
            notes={activeNotes}
            onUpdateModule={updateActiveModule}
            onUpdateEdge={updateActiveEdge}
            onAddNote={addActiveNote}
            onUpdateNote={updateActiveNote}
            onDeleteNote={deleteActiveNote}
            onAddEdge={curSub ? () => {} : addEdge}
            onDeleteEdge={deleteActiveEdge}
            selectedId={selectedId}
            onSelect={(id) => { setSelectedId(id); if (view === 'graph') setTweak('primaryView', 'split'); setDetailOpen(true); }}
            onDrillDown={onDrillDown}
            hoveredId={hoveredId}
            setHoveredId={setHoveredId}
            filters={filters}
            scanState={scanState}
            desyncResolved={desyncResolved}
            activeFlash={activeFlash}
            detailed={tweaks.primaryView === 'split'}
            showLanes={tweaks.showLayers}
            showLabels={showEdgeLabels}
            schemaTitle={activeSub ? activeSub.title : schemaTitle}
            onUpdateSchemaTitle={activeSub ? () => {} : setSchemaTitle}
            onSimaGenerate={onSimaGenerate}
            onLaneResize={onLaneResize}
          />
          {(drillStack.length > 0 || drillId) && (
            <div className="drill-crumbs">
              <button onClick={() => { setDrillStack([]); setDrillId(null); }}>↑ верхний уровень</button>
              {drillStack.map((id, i) => (
                <React.Fragment key={id}>
                  <span className="sep">/</span>
                  {i === drillStack.length - 1 && !drillId
                    ? <span className="cur">@{data.subsystems[id]?.codename || id}</span>
                    : <button onClick={() => { setDrillStack(s => s.slice(0, i + 1)); setDrillId(null); }}>@{data.subsystems[id]?.codename || id}</button>}
                </React.Fragment>
              ))}
              {drillId && <><span className="sep">/</span><span className="cur">только @{activeModules.find(m=>m.id===drillId)?.tag}</span></>}
            </div>
          )}
          {activeSub && (
            <div className="sub-banner">
              <div>
                <div className="mono" style={{ fontSize: 10.5, color: 'var(--ink-4)', letterSpacing: '0.08em' }}>SUBSYSTEM · {activeSub.codename}</div>
                <div style={{ fontFamily: 'Newsreader, serif', fontStyle: 'italic', fontSize: 17, marginTop: 2 }}>{activeSub.title}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 2, maxWidth: 460 }}>{activeSub.subtitle}</div>
              </div>
              <div className="sub-kpi">
                {activeSub.kpi.map(k => (
                  <div key={k.code}><div className="mono" style={{ fontSize: 11, fontWeight: 600 }}>{k.code}</div><div style={{ fontSize: 10.5, color: 'var(--ink-4)' }}>{k.label}</div></div>
                ))}
              </div>
            </div>
          )}
          <button className="sima-action-btn" onClick={() => onSimaGenerate('module', selectedId || activeModules[0].id)} title="Sima дополнит описание выбранного блока">
            <span className="star">✨</span> Sima · дополнить описание
          </button>
        </>
      ) : (
        <LayeredV2 data={data} modules={modules} onSelect={(id) => { setSelectedId(id); setTweak('primaryView', 'split'); setDetailOpen(true); }} desyncResolved={desyncResolved} />
      )}

      {/* Canvas tools — only over graph */}
      {view !== 'layered' && (
        <>
          <div className="canvas-tools">
            <div className="grp">
              <button onClick={() => setShowEdgeLabels(s => !s)} className={showEdgeLabels ? 'on' : ''}>
                ⇄ Подписи связей <span className="badge">{showEdgeLabels ? 'on' : 'off'}</span>
              </button>
              <button onClick={() => setTweak('showLayers', !tweaks.showLayers)} className={tweaks.showLayers ? 'on' : ''}>
                ▦ Слои стэка <span className="badge">{tweaks.showLayers ? 'on' : 'off'}</span>
              </button>
              <button onClick={onAddModule}>＋ Новый модуль <span className="badge">пкм</span></button>
            </div>
            <div className="grp">
              <div style={{ fontSize: 10, color: 'var(--ink-4)', padding: '4px 8px 2px', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Фильтр статуса</div>
              {filtersList.map(f => (
                <button
                  key={f.id}
                  onClick={() => toggleFilter(f.id)}
                  className={filters.has(f.id) ? 'on' : ''}
                  style={{ fontSize: 11 }}
                >
                  <span className="status-dot" style={{ width: 7, height: 7, borderRadius: '50%', background: `var(--st-${f.id})`, display: 'inline-block', marginRight: 6 }} />
                  {f.label}
                  <span className="badge">{data.modules.filter(m => m.status === f.id).length}</span>
                </button>
              ))}
              {filters.size > 0 && (
                <button onClick={() => setFilters(new Set())} style={{ color: 'var(--ink-3)', fontSize: 10.5 }}>сбросить</button>
              )}
            </div>
          </div>

          <div className="canvas-legend">
            {filtersList.slice(0, 5).map(f => (
              <span key={f.id} className="item">
                <span className="dot" style={{ background: `var(--st-${f.id})` }} />{f.label}
              </span>
            ))}
            <span style={{ borderLeft: '1px solid var(--rule-2)', paddingLeft: 14, color: 'var(--ink-4)' }}>
              <span className="kbd">2×клик</span> — внутрь модуля · <span className="kbd">⇢</span> от точки на узле — связь · клик по линии — удалить
            </span>
          </div>
        </>
      )}

      {/* SYNC BANNER */}
      {scanState === 'scanning' && (
        <div className="sync-banner scanning">
          <span className="ic">⟳</span>
          <div>
            <div style={{ fontWeight: 600 }}>Проверяю синхронизацию схемы…</div>
            <div style={{ color: 'var(--ink-3)', fontSize: 11.5 }}>читаю описания всех 16 модулей и сверяю связи</div>
          </div>
        </div>
      )}
      {scanState === 'found' && !desyncResolved && (
        <div className="sync-banner">
          <span className="ic">!</span>
          <div>
            <div style={{ fontWeight: 600 }}>Рассинхрон между <span className="mono">metrics-dsl</span> и <span className="mono">ingest-api</span></div>
            <div style={{ color: 'var(--ink-3)', fontSize: 11.5 }}>AST ссылается на user_id, в ingest-схеме поле — actor_id</div>
          </div>
          <button onClick={() => { setSelectedId('metrics'); }}>Открыть</button>
          <button className="primary" onClick={resolveDesync}>Исправить →</button>
        </div>
      )}
      {scanState === 'resolved' && (
        <div className="sync-banner ok">
          <span className="ic">✓</span>
          <div>
            <div style={{ fontWeight: 600 }}>Схема синхронна</div>
            <div style={{ color: 'var(--ink-3)', fontSize: 11.5 }}>все 21 связь сходятся, KPI блоков пересчитаны</div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && tweaks.liveActivity && (
        <div className="activity-toast" key={toast.msg}>
          <span className="dot" style={{ background: toast.kind === 'ok' ? 'var(--st-done)' : toast.kind === 'err' ? 'var(--st-fail)' : toast.kind === 'warn' ? 'var(--st-progress)' : 'var(--ink-3)' }} />
          <div>
            <div className="ag mono">{toast.agent}</div>
            <div>{toast.msg}</div>
          </div>
        </div>
      )}
      </div>{/* /canvas-stage */}

      {/* DOCK */}
      <Dock
        data={data}
        log={log}
        onSendToAgent={onSendToAgent}
        collapsed={dockCollapsed}
        setCollapsed={setDockCollapsed}
        activeAgent={activeAgent}
        setActiveAgent={setActiveAgent}
      />

      {/* DETAIL */}
      {detailOpen ? (
        <DetailPanel
          data={data}
          moduleId={selectedId}
          onClose={() => setDetailOpen(false)}
          desyncResolved={desyncResolved}
          onSendToAgent={onSendToAgent}
          onDrillDown={onDrillDown}
        />
      ) : (
        <button className="detail-reopen" onClick={() => setDetailOpen(true)} title="Открыть детали">◀</button>
      )}

      {/* COMMAND BAR */}
      {cmdOpen && (
        <CommandBar
          data={data}
          onClose={() => setCmdOpen(false)}
          onSelect={(id) => { setSelectedId(id); setCmdOpen(false); setTweak('primaryView', 'split'); }}
          onSync={() => { setCmdOpen(false); runSyncCheck(); }}
        />
      )}

      {/* TWEAKS */}
      <TweaksPanel title="Tweaks">
        <TweakSection title="Стиль">
          <TweakRadio label="Тема"
            value={tweaks.theme}
            onChange={v => setTweak('theme', v)}
            options={[
              { value: 'editorial', label: 'Editorial' },
              { value: 'blueprint', label: 'Blueprint' },
              { value: 'dark', label: 'Dark' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Вид">
          <TweakRadio label="Главный канвас"
            value={tweaks.primaryView}
            onChange={v => setTweak('primaryView', v)}
            options={[
              { value: 'graph', label: 'Граф' },
              { value: 'split', label: 'Граф + детали' },
              { value: 'layered', label: 'Слои 3D' },
            ]}
          />
        </TweakSection>
        <TweakSection title="Карта">
          <TweakToggle label="Подсветка слоёв (backend / frontend / logic / tests)"
            checked={tweaks.showLayers}
            onChange={v => setTweak('showLayers', v)} />
          <TweakToggle label="Подписи на связях"
            checked={showEdgeLabels}
            onChange={v => setShowEdgeLabels(v)} />
          <TweakToggle label="Анимировать живые события"
            checked={tweaks.liveActivity}
            onChange={v => setTweak('liveActivity', v)} />
        </TweakSection>
        <TweakSection title="Демо">
          <TweakButton label="Показать подсказки заново"
            onClick={() => setOnboarding(true)} />
          <TweakButton label="Запустить sync-check + рассинхрон"
            onClick={() => { setDesyncResolved(false); runSyncCheck(); }} />
          <TweakButton label="Сбросить состояние"
            onClick={() => { setDesyncResolved(false); setScanState('idle'); setSelectedId(null); setFilters(new Set()); setDrillId(null); setEdges(data.edges.map(e => ({ ...e }))); setModules(data.modules.map(m => ({ ...m }))); }} />
        </TweakSection>
      </TweaksPanel>

      {/* ONBOARDING */}
      {onboarding && (
        <div className="onboarding" onClick={() => setOnboarding(false)}>
          <div className="onb-card" onClick={e => e.stopPropagation()}>
            <div className="onb-eyebrow mono">sima atlas · 30 секунд</div>
            <h2>Это карта вашего продукта.</h2>
            <p>Каждый блок — модуль. Цвет точки и полоска снизу = статус. Стрелки — кто кого использует. AI-агенты получают контекст <em>именно нужного</em> блока, не всю кодовую базу.</p>
            <div className="onb-rows">
              <div className="onb-row"><span className="num mono">01</span><div><strong>Клик</strong> по модулю — детали справа: задачи, KPI, память решений.</div></div>
              <div className="onb-row"><span className="num mono">02</span><div><strong>2× клик</strong> — провалиться внутрь блока (видно только его и связи).</div></div>
              <div className="onb-row"><span className="num mono">03</span><div><strong>▸ подмод.</strong> на карточке — раскрыть подмодули прямо в графе.</div></div>
              <div className="onb-row"><span className="num mono">04</span><div><strong>Точка-порт</strong> на краю узла — потяните, чтобы соединить два модуля. Клик по линии — удалить.</div></div>
              <div className="onb-row"><span className="num mono">05</span><div><strong>«1 рассинхрон»</strong> в шапке — sima сама ловит расхождения между модулями и предлагает фикс.</div></div>
            </div>
            <button className="onb-go" onClick={() => setOnboarding(false)}>Понятно, поехали →</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CommandBar({ data, onClose, onSelect, onSync }) {
  const [q, setQ] = useState('');
  const [active, setActive] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const items = useMemo(() => {
    const cmds = [
      { type: 'cmd', ic: '⟳', label: 'Запустить sync-check', hint: '⏎', run: onSync },
      { type: 'cmd', ic: '＋', label: 'Создать новый модуль', hint: '⏎', run: () => onClose() },
      { type: 'cmd', ic: '⤴', label: 'Открыть Roadmap', hint: '⏎', run: () => onClose() },
    ];
    const mods = data.modules.map(m => ({
      type: 'mod', ic: '◆', label: m.title, hint: '@' + m.tag, run: () => onSelect(m.id),
    }));
    const all = [...cmds, ...mods];
    if (!q) return all;
    const ql = q.toLowerCase();
    return all.filter(x => x.label.toLowerCase().includes(ql) || (x.hint || '').toLowerCase().includes(ql));
  }, [q]);

  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, items.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
    if (e.key === 'Enter')     { e.preventDefault(); items[active]?.run(); }
  };

  return (
    <div className="cmd-bar" onClick={onClose}>
      <div className="cmd-box" onClick={e => e.stopPropagation()}>
        <input
          ref={inputRef}
          placeholder="Команда или модуль…"
          value={q}
          onChange={e => { setQ(e.target.value); setActive(0); }}
          onKeyDown={onKey}
        />
        <div className="cmd-list">
          {items.slice(0, 12).map((it, i) => (
            <div key={i} className={`cmd-row ${i === active ? 'active' : ''}`} onMouseEnter={() => setActive(i)} onClick={() => it.run()}>
              <span className="ic">{it.ic}</span>
              <span>{it.label}</span>
              <span className="hint">{it.hint}</span>
            </div>
          ))}
          {items.length === 0 && <div style={{ padding: 14, color: 'var(--ink-3)', fontSize: 12 }}>Ничего не найдено</div>}
        </div>
      </div>
    </div>
  );
}

function nowTs() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// PR — wait for live data fetch (with a hard 600ms cap baked into
// data_loader.js) so App sees the freshest window.SIMA_DATA. If the
// fetch arrives later, we re-mount on the `sima-data-changed` event.
const __bootPromise = window.__SIMA_DATA_BOOT_PROMISE || Promise.resolve();
__bootPromise.then(() => {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  function mount() { root.render(<App key={(window.SIMA_DATA && window.SIMA_DATA._meta && window.SIMA_DATA._meta.generated_at) || Date.now()} />); }
  mount();
  // Live updates: re-mount on `sima-data-changed`. Cheap because the
  // App tree is small; the `key` change forces React to read the fresh
  // window.SIMA_DATA closure-free.
  window.addEventListener('sima-data-changed', mount);
});
</script>
</body>
</html>
